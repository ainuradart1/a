# ===============================
# Kitty Assistant Config (RAILWAY READY)
# ===============================

# ===== SERVER =====
# ??? ??????? ??????????? ??? Railway:
server.port=${PORT:8080}

# ===== POSTGRESQL DATABASE =====
# ===== POSTGRESQL DATABASE =====
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
# Hibernate ??? ?????? ???????, ????? ???????? ???
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# ??????? ?????? ???? ? ???????
spring.jpa.open-in-view=false

# ===== AI =====
groq.api.key=${GROQ_API_KEY:your_groq_key_here}

# ===== APP =====
spring.application.name=kittyassistant

# ===== Google OAuth2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id_here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===== Spring Batch =====
# ????????? ?????????????? ?????? ????? ??? ??????
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ===== UI Fixes =====
# ????? Spring ?? ??????? ?? ?????????? ????? templates (?.?. ? ??? ???????)
spring.thymeleaf.check-template-location=false