# ===== SERVER =====
server.port=8080

# ===== POSTGRESQL DATABASE =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kittyassistant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== AI =====
groq.api.key=${GROQ_API_KEY:your_groq_key_here}

# ===== APP =====
spring.application.name=kittyassistant

# ===== Google OAuth2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id_here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===== Spring Batch =====
spring.batch.job.enabled=false
